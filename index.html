<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anki Light - .apkg 対応版</title>
  <!-- JSZip & sql.js (WebAssembly) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-color); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
    h1 { font-size: 1.1rem; color: var(--accent-blue); font-weight: 700; }
    .stats { display: flex; gap: 12px; font-weight: 600; font-size: 0.85rem; }
    .stat-new { color: var(--accent-blue); }
    .stat-learn { color: var(--accent-red); }
    .stat-review { color: var(--accent-green); }

    .main-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 20px 0; }
    
    .card-container {
      width: 100%;
      max-width: 650px;
      min-height: 320px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }
    .card-badge { position: absolute; top: 16px; left: 20px; font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; }
    .card-front { font-size: 2rem; font-weight: 800; color: #ffffff; margin-bottom: 12px; line-height: 1.3; }
    .divider { width: 90%; height: 1px; background: var(--border-color); margin: 18px 0; display: none; }
    .card-back { font-size: 1.15rem; line-height: 1.6; color: var(--text-primary); display: none; text-align: left; width: 100%; padding: 0 10px; }

    .control-panel { width: 100%; max-width: 650px; margin-top: 12px; }
    .show-answer-btn {
      width: 100%; padding: 18px; background: var(--accent-blue); color: #0f172a;
      font-size: 1.15rem; font-weight: 800; border: none; border-radius: 14px; cursor: pointer;
    }
    .rating-buttons { display: none; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .rate-btn { padding: 14px 6px; border: none; border-radius: 12px; font-weight: 800; font-size: 0.95rem; cursor: pointer; color: #fff; }
    .rate-again { background: #ef4444; } .rate-hard { background: #f59e0b; }
    .rate-good { background: #10b981; } .rate-easy { background: #3b82f6; }

    footer { display: flex; justify-content: center; gap: 12px; padding-top: 12px; border-top: 1px solid var(--border-color); }
    .footer-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; }
    
    /* Loading overlay */
    #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.85); color: var(--accent-blue); font-weight: bold; font-size: 1.2rem; justify-content: center; align-items: center; flex-direction: column; z-index: 200; }
    .spinner { border: 4px solid var(--border-color); border-top: 4px solid var(--accent-blue); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 12px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">.apkg ファイルを解析中...</div>
  </div>

  <header>
    <h1>Anki Web App</h1>
    <div class="stats">
      <div class="stat-new">New: <span id="count-new">0</span></div>
      <div class="stat-learn">Learn: <span id="count-learn">0</span></div>
      <div class="stat-review">Review: <span id="count-review">0</span></div>
    </div>
  </header>

  <div class="main-area">
    <div class="card-container" id="card-element" onclick="toggleAnswer()">
      <div class="card-badge" id="card-status">READY</div>
      <div id="card-content-area">
        <div class="card-front" id="card-front">.apkg ファイルを読み込んでください</div>
        <div class="divider" id="card-divider"></div>
        <div class="card-back" id="card-back">下部の「.apkg を読み込む」ボタンからデッキを追加できます。</div>
      </div>
    </div>

    <div class="control-panel">
      <button class="show-answer-btn" id="show-answer-btn" onclick="toggleAnswer()">答えを表示 (Tap / Space)</button>
      <div class="rating-buttons" id="rating-buttons">
        <button class="rate-btn rate-again" onclick="rateCard(1)">Again</button>
        <button class="rate-btn rate-hard" onclick="rateCard(2)">Hard</button>
        <button class="rate-btn rate-good" onclick="rateCard(3)">Good</button>
        <button class="rate-btn rate-easy" onclick="rateCard(4)">Easy</button>
      </div>
    </div>
  </div>

  <footer>
    <input type="file" id="apkg-file-input" accept=".apkg" style="display: none;" onchange="importApkg(event)">
    <button class="footer-btn" onclick="document.getElementById('apkg-file-input').click()">.apkg を読み込む</button>
    <button class="footer-btn" onclick="resetProgress()">データリセット</button>
  </footer>

  <script>
    let cards = [];
    let currentCardIndex = -1;
    let isShowingAnswer = false;

    function init() {
      const saved = localStorage.getItem("anki_app_cards");
      if (saved) {
        try {
          cards = JSON.parse(saved);
        } catch(e) { cards = []; }
      }
      loadNextCard();
    }

    function saveCards() {
      localStorage.setItem("anki_app_cards", JSON.stringify(cards));
    }

    function updateStats() {
      const now = Date.now();
      let n = 0, l = 0, r = 0;
      cards.forEach(c => {
        if (c.status === "new") n++;
        else if (c.status === "learning") l++;
        else if (c.status === "review" && c.dueDate <= now) r++;
      });
      document.getElementById("count-new").innerText = n;
      document.getElementById("count-learn").innerText = l;
      document.getElementById("count-review").innerText = r;
    }

    function loadNextCard() {
      updateStats();
      isShowingAnswer = false;
      document.getElementById("card-divider").style.display = "none";
      document.getElementById("card-back").style.display = "none";
      document.getElementById("show-answer-btn").style.display = "block";
      document.getElementById("rating-buttons").style.display = "none";

      if (cards.length === 0) {
        document.getElementById("card-status").innerText = "NO CARDS";
        document.getElementById("card-front").innerText = "カードがありません";
        document.getElementById("card-back").innerHTML = ".apkg ファイルを読み込んでください。";
        document.getElementById("card-back").style.display = "block";
        document.getElementById("show-answer-btn").style.display = "none";
        currentCardIndex = -1;
        return;
      }

      const now = Date.now();
      let eligible = cards.filter(c => c.status === "review" && c.dueDate <= now);
      if (eligible.length === 0) eligible = cards.filter(c => c.status === "learning");
      if (eligible.length === 0) eligible = cards.filter(c => c.status === "new");

      if (eligible.length === 0) {
        document.getElementById("card-status").innerText = "COMPLETE";
        document.getElementById("card-front").innerText = "🎉 本日の復習完了！";
        document.getElementById("card-back").innerHTML = "学習予定のカードはすべて終了しました。";
        document.getElementById("card-back").style.display = "block";
        document.getElementById("show-answer-btn").style.display = "none";
        currentCardIndex = -1;
        return;
      }

      const card = eligible[Math.floor(Math.random() * eligible.length)];
      currentCardIndex = cards.findIndex(c => c.id === card.id);

      document.getElementById("card-status").innerText = card.status.toUpperCase();
      document.getElementById("card-front").innerHTML = card.front;
      document.getElementById("card-back").innerHTML = card.meaning;
    }

    function toggleAnswer() {
      if (currentCardIndex === -1 || isShowingAnswer) return;
      isShowingAnswer = true;
      document.getElementById("card-divider").style.display = "block";
      document.getElementById("card-back").style.display = "block";
      document.getElementById("show-answer-btn").style.display = "none";
      document.getElementById("rating-buttons").style.display = "grid";
    }

    function rateCard(rating) {
      if (currentCardIndex === -1) return;
      const card = cards[currentCardIndex];
      const now = Date.now();

      if (rating === 1) {
        card.status = "learning";
        card.interval = 0;
        card.dueDate = now + 60 * 1000;
      } else {
        card.status = "review";
        card.interval = rating === 2 ? 1 : (rating === 3 ? 3 : 7);
        card.dueDate = now + card.interval * 24 * 60 * 60 * 1000;
      }
      saveCards();
      loadNextCard();
    }

    // .apkg ファイルの読み込み処理
    async function importApkg(event) {
      const file = event.target.files[0];
      if (!file) return;

      showLoading(true, "ファイルを解凍中...");

      try {
        // 1. JSZipで.apkg (Zip) を解析
        const zip = await JSZip.loadAsync(file);
        
        // collection.anki2 または collection.anki21 ファイルの取得
        const dbEntry = zip.file("collection.anki2") || zip.file("collection.anki21");
        if (!dbEntry) {
          throw new Error("Ankiデータベース (collection.anki2) が見つかりませんでした。");
        }

        showLoading(true, "データベース解析中...");
        const dbBuffer = await dbEntry.async("uint8array");

        // 2. sql.js (WebAssembly) の初期化
        const SQL = await initSqlJs({
          locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
        });

        // 3. SQLiteデータベース接続 & ノートテーブル抽出
        const db = new SQL.Database(dbBuffer);
        const res = db.exec("SELECT flds FROM notes");

        if (res.length === 0 || !res[0].values) {
          throw new Error("単語データが存在しませんでした。");
        }

        const newCards = [];
        res[0].values.forEach((row, idx) => {
          // Ankiのフィールド区切り文字は   (US: Unit Separator)
          const fields = row[0].split(" ");
          if (fields.length >= 1) {
            newCards.push({
              id: Date.now() + idx,
              front: cleanAnkiHtml(fields[0]),
              meaning: cleanAnkiHtml(fields[1] || fields.slice(1).join("<br>")),
              interval: 0,
              reps: 0,
              ease: 2.5,
              dueDate: Date.now(),
              status: "new"
            });
          }
        });

        if (newCards.length > 0) {
          cards = newCards;
          saveCards();
          alert(`${newCards.length} 件の単語カードを取り込みました！`);
          loadNextCard();
        } else {
          alert("カードを読み込めませんでした。");
        }

      } catch (err) {
        alert("読み込みエラー: " + err.message);
        console.error(err);
      } finally {
        showLoading(false);
        event.target.value = ""; // 入力クリア
      }
    }

    function cleanAnkiHtml(htmlStr) {
      if (!htmlStr) return "";
      // サウンドタグ [sound:xxx.mp3] や特殊アノテーションの簡易除去
      return htmlStr.replace(/\[sound:.*?\]/g, "").trim();
    }

    function showLoading(show, text = "") {
      const overlay = document.getElementById("loading-overlay");
      document.getElementById("loading-text").innerText = text;
      overlay.style.display = show ? "flex" : "none";
    }

    function resetProgress() {
      if (confirm("学習データを削除しますか？")) {
        localStorage.removeItem("anki_app_cards");
        cards = [];
        loadNextCard();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
